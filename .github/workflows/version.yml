# Used to version this repository
name: Version

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Get local package.json version
        id: package-json-version
        uses: aspithost/actions/node/get-local-package-information@v3
        with:
          working-directory: '.'

      - name: Format git tag
        id: tag
        env:
          VERSION: ${{ steps.package-json-version.outputs.version }}
        run: echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        uses: ./git/create-and-push-tag@v3
        with:
          tag: ${{ steps.tag.outputs.name }}

      - name: Create and push rolling tags
        uses: ./git/create-and-push-rolling-tags@v3
        with:
          tag: ${{ steps.tag.outputs.name }}
