# Note: internal use only. Used to version this repository
name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag-name:
        description: New semver tag name
        required: true
        type: string

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Get local package.json version
        id: package-json-version
        uses: ./node/get-local-package-information  
        with:
          working-directory: '.'

      - name: Format git tag
        id: tag
        env:
          VERSION: ${{ steps.package-json-version.outputs.version }}
        run: echo "name=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        uses: ./git/create-and-push-tag
        with:
          tag: ${{ steps.tag.outputs.name }}

      - name: Create and push rolling tags
        uses: ./git/create-and-push-rolling-tags
        with:
          tag: ${{ steps.tag.outputs.name }}
