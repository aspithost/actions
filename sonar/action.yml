name: SonarQube scan
description: Run a SonarQube scan

inputs:
  sonar-token:
    description: SonarQube authentication token
    required: true
  artifact-name:
    description: Name of the build artifact to download
    required: false
    default: coverage
  artifact-path:
    description: Path of the build artifact to download
    required: false
    default: coverage/
  sonar-host-url:
    description: SonarQube host URL. Defaults to Sonarcloud
    required: false
    default: https://sonarcloud.io
  working-directory:
    description: The path to the package directory
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Download Vitest Coverage Results
      uses: actions/download-artifact@v8
      continue-on-error: true # If user does not provide coverage report, run Sonar scan without it
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}

    - uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
      with:
        args: >
          -Dsonar.javascript.lcov.reportPaths=${{ inputs.working-directory }}/${{ inputs.artifact-path }}lcov.info
